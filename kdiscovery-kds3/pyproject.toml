[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kdiscovery-kds3"
version = "0.1.0"
description = "Requirements-led GitHub discovery with lightweight code indexing and requirement MRG output"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1", "jsonschema>=4.20,<5",
  "tree-sitter==0.25.2", "tree-sitter-bash==0.25.1",
  "tree-sitter-cpp==0.23.4", "tree-sitter-java==0.23.5",
  "tree-sitter-javascript==0.25.0", "tree-sitter-php==0.25.1",
  "tree-sitter-python==0.25.0", "tree-sitter-scala==0.26.4",
  "tree-sitter-typescript==0.23.2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
kdiscovery = "kdiscovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kdiscovery = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
